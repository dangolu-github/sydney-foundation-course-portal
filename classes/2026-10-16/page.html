<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Opening class resource · Sydney Foundation Course Portal</title>
  <style>
:root{--ink:#182732;--muted:#64717a;--paper:#f3f1ec;--card:#fff;--line:#d7dbdc;
  --navy:#173a59;--blue:#1769aa;--orange:#a74818;--shadow:0 14px 38px rgba(22,36,45,.10)}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}
.shell{width:min(960px,calc(100% - 28px));margin:auto;padding:34px 0 64px}
.topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:14px;font-weight:800}
.topbar a{color:var(--blue);text-decoration:none}
.topbar a:hover,.topbar a:focus-visible{text-decoration:underline}
.hero{padding:18px 0 22px;border-bottom:1px solid var(--line)}
.kicker{color:var(--orange);font-size:12px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}
.hero h1{margin:8px 0 10px;font-size:clamp(28px,6vw,48px);line-height:1.05;letter-spacing:-.04em;color:var(--navy)}
.hero p{max-width:640px;margin:0;color:var(--muted);font-size:16px}
.section-tools{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 14px}
.section-tools button{font:inherit;font-weight:800;border:1px solid #9fb0bb;background:var(--card);
  color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
.section-tools button:hover{background:#eef3f7}
.section-tools button:focus-visible{outline:3px solid rgba(23,105,170,.35);outline-offset:2px}
.panel{margin-bottom:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);
  box-shadow:var(--shadow);overflow:hidden}
.panel>summary{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:space-between;
  padding:18px 20px;cursor:pointer;list-style:none}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary:focus-visible{outline:3px solid rgba(23,105,170,.35);outline-offset:-3px}
.panel-title{color:var(--navy);font-size:21px;font-weight:900;letter-spacing:-.02em}
.panel-title::before{content:"\25B8 ";color:var(--blue)}
.panel[open]>summary .panel-title::before{content:"\25BE "}
.panel-hint{color:var(--muted);font-size:13px}
.panel-body{padding:2px 20px 20px}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rows li{display:block}
.rowlink{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between;
  padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fbfcfd;
  color:inherit;text-decoration:none}
.rowlink:hover,.rowlink:focus-visible{border-color:#9db0bb;background:#f2f7fb;
  outline:3px solid rgba(23,105,170,.16);outline-offset:2px}
.rowlink .name{font-size:17px;font-weight:800;color:var(--navy)}
.rowlink .meta{color:var(--muted);font-size:13px}
.rowlink .go{color:var(--blue);font-weight:900}
.empty{margin:0;padding:14px 16px;border:1px dashed var(--line);border-radius:12px;
  color:var(--muted);font-size:14px}
.notice{margin:18px 0 0;padding:13px 15px;border:1px solid #e0cfa8;border-radius:12px;
  background:#fdf7ea;color:#6a5118;font-size:13px}
footer{margin-top:28px;color:var(--muted);font-size:12px}
footer a{color:var(--blue)}
@media(max-width:560px){
  .shell{padding-top:22px}
  .panel>summary{padding:15px 15px}
  .panel-body{padding:2px 15px 16px}
  .panel-title{font-size:19px}
  .rowlink{padding:12px 13px}
  .rowlink .go{display:none}
}
@media print{
  html,body{background:#fff}
  .shell{width:auto;padding:0}
  .section-tools,.topbar{display:none!important}
  .panel{box-shadow:none;break-inside:avoid}
  .panel>summary{cursor:auto}
}
.status{margin:22px 0 0;padding:16px 18px;border:1px solid var(--line);border-radius:14px;
  background:var(--card);box-shadow:var(--shadow)}
.status h2{margin:0 0 6px;color:var(--navy);font-size:19px}
.status p{margin:0;color:var(--muted);font-size:15px}
.status.bad{border-color:#d9b1a4;background:#fdf3ef}
.status.bad h2{color:var(--orange)}
  </style>
</head>
<body>
  <main class="shell" id="sf02Shell">
    <nav class="topbar" aria-label="Portal navigation"><a href="./">&larr; Class page</a><a href="../../">Course home</a></nav>
    <header class="hero">
      <div class="kicker">Class review</div>
      <h1>Opening&hellip;</h1>
      <p>The material opens on this page in a moment.</p>
    </header>
    <div class="status" id="sf02Status" role="status" aria-live="polite"><h2>Opening</h2><p>One moment.</p></div>
  </main>
  <script type="application/json" id="sf02Allow">{"classDate":"2026-10-16","resources":{"task1":{"title":"Task 1 · 完整课堂批注","file":"task1.bin"},"precision-a":{"title":"Listening Precision · 已讲 A 部分","file":"precision-a.bin"},"knowledge":{"title":"10 月 16 日 · 知识与词汇总结","file":"knowledge.bin"},"homework":{"title":"课后作业 · 刷题与错题整理","file":"homework.bin"}}}</script>
  <script>
(function(){
var ALLOW=JSON.parse(document.getElementById('sf02Allow').textContent);
var STORE='sf02-class-key-v1';
function show(heading,detail,bad){
  var box=document.getElementById('sf02Status');
  box.className='status'+(bad?' bad':'');
  box.innerHTML='';
  var h=document.createElement('h2');h.textContent=heading;
  var p=document.createElement('p');p.textContent=detail;
  box.appendChild(h);box.appendChild(p);
  document.querySelector('.hero h1').textContent=bad?'Cannot open this resource':'Opening…';
}
function fragment(){return new URLSearchParams(location.hash.replace(/^#/,''))}
function bytes(b64u){
  var b64=String(b64u).replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length%4)b64+='=';
  var bin=atob(b64),out=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
  return out;
}
function run(){
  var frag=fragment();
  var id=new URLSearchParams(location.search).get('p')||frag.get('p')||'';
  // Only an id this release actually published may be requested, and only as a plain file name in
  // this directory: an id is never joined onto a path the caller supplies.
  var entry=Object.prototype.hasOwnProperty.call(ALLOW.resources,id)?ALLOW.resources[id]:null;
  if(!id)return show('This link is missing its resource',
    'Open the class page and choose a resource from the list.',true);
  if(!entry)return show('Not a resource in this class release',
    'The link asks for "'+id+'", which this class page does not publish.',true);
  var key=frag.get('k')||'';
  if(key){try{sessionStorage.setItem(STORE,key)}catch(e){}
    history.replaceState(null,'',location.pathname+location.search)}
  else{try{key=sessionStorage.getItem(STORE)||''}catch(e){key=''}}
  // Every branch below refuses to show anything: the gates are unchanged, only their wording is
  // learner-facing. The technical account of the capability link lives in the private release record.
  if(!key)return show('This material cannot be opened from this link',
    'Open the course link supplied by your teacher.',true);
  var raw;
  try{raw=bytes(key)}catch(e){raw=null}
  if(!raw||raw.length!==32)return show('This material cannot be opened from this link',
    'Open the course link supplied by your teacher.',true);
  if(!(window.crypto&&window.crypto.subtle))return show('This browser cannot open the material',
    'Please try a current browser, opening the page over https.',true);
  document.title=entry.title+' · Sydney Foundation Course Portal';
  show('Opening',entry.title);
  var payload;
  fetch(entry.file,{cache:'no-store',referrerPolicy:'no-referrer'}).then(function(r){
    if(!r.ok)throw new Error('http '+r.status);
    return r.arrayBuffer();
  }).then(function(buf){
    payload=new Uint8Array(buf);
    if(payload.length<29)throw new Error('short payload');
    return window.crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
  }).then(function(ck){
    return window.crypto.subtle.decrypt({
      name:'AES-GCM',iv:payload.subarray(0,12),
      additionalData:new TextEncoder().encode('sf02/'+ALLOW.classDate+'/'+id),tagLength:128
    },ck,payload.subarray(12));
  }).then(function(plain){
    var html=new TextDecoder('utf-8',{fatal:true}).decode(plain);
    // The resource is its own complete document, so it replaces this one rather than sitting in a
    // frame: its structure, annotation styling and own scripts all stay exactly as written.
    document.open();document.write(html);document.close();
  }).catch(function(err){
    if(err&&(err.name==='TypeError'||/http |short payload/.test(String(err.message))))
      return show('This material could not be loaded',
        'Please try again, or open the course link supplied by your teacher.',true);
    show('This material cannot be opened from this link',
      'Open the course link supplied by your teacher.',true);
  });
}
try{run()}catch(e){show('Cannot open this resource','Nothing was shown.',true)}
})();
  </script>
</body>
</html>
